[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-player-lab"
version = "0.1.1"
description = "Laboratório experimental: pixels, estado temporal, Jev e memória assíncrona"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "opencv-python>=4.10,<5", "scipy>=1.11,<2",
  "httpx>=0.27,<1", "psutil>=5.9,<8", "mss>=9,<11"
]
[project.optional-dependencies]
desktop = ["pynput>=1.7,<2"]
dev = ["pytest>=8,<10"]
[project.scripts]
ai-player = "ai_player_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
